# Publishes only the requested SVG/PNG review images; private test logs remain on the runner.
name: Native ECP5 component pad-grid review
on:
  push:
    branches: [artifacts/ecp5-component-grid-previews]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: review
      - uses: actions/checkout@v4
        with:
          ref: 427ccd6530e99c52b8e11bd545a3dd995c7fbbb0
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e2f5337b7cce61627bc74f6f48bc907cb66bac4c
          path: head
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Render the unchanged native repro and existing ButterStick test
        run: |
          cp base/tests/native-ecp5-pad-channel-grid.test.ts head/tests/
          mkdir -p head/tests/fixtures/ecp5-pad-channel-grid
          cp base/tests/fixtures/ecp5-pad-channel-grid/input.json.gz head/tests/fixtures/ecp5-pad-channel-grid/
          mkdir -p review/.github/artifacts
          for variant in base head; do
            (
              cd "$variant"
              bun install > install.private.log 2>&1
              npm rebuild sharp > sharp.private.log 2>&1
              BUN_UPDATE_SNAPSHOTS=1 bun test tests/native-ecp5-pad-channel-grid.test.ts tests/negotiatedClearanceSearch.butterstickMovablePeerVia.test.ts > preview.private.log 2>&1
              VARIANT="$variant" bun -e '
                import { readFile, writeFile } from "node:fs/promises";
                import sharp from "sharp";
                for (const [name,file] of [
                  ["native-ecp5-grid","native-ecp5-pad-channel-grid.snap.svg"],
                  ["butterstick-peer","negotiatedClearanceSearch.butterstickMovablePeerVia-visual.snap.svg"]
                ]) {
                  const svg=await readFile("tests/__snapshots__/"+file);
                  const prefix="../review/.github/artifacts/"+name+"-"+process.env.VARIANT;
                  await writeFile(prefix+".svg",svg);
                  await writeFile(prefix+".png",await sharp(svg).png().toBuffer());
                }
                console.log("REVIEW_IMAGES_RENDERED="+process.env.VARIANT);
              '
            )
          done
      - name: Commit requested review images
        working-directory: review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/artifacts/*.svg .github/artifacts/*.png
          git commit -m "Render native A13 grid and ButterStick candidate before and after"
          git push
