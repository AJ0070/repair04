name: Verify physical pad-grid anchor reach
on:
  push:
    branches: [artifacts/verify-pad-grid-anchor-reach]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: |
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('package.json')
          data=json.loads(p.read_text())
          data['overrides']={**data.get('overrides',{}),'csstype':'3.1.3'}
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          bun install
      - run: bun test --timeout 9999999
      - run: bun run typecheck
      - run: bun run format:check
